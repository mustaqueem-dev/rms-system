# docker-compose.yml  (monorepo root)

version: '3.9'

# ─── Infrastructure ───────────────────────────────────────────────────────────

services:
  mongodb:
    image: mongo:7.0
    container_name: rms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rms
      MONGO_INITDB_ROOT_PASSWORD: rms_secret
      MONGO_INITDB_DATABASE:      rms_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: rms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: rms-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID:                         1
      KAFKA_PROCESS_ROLES:                   broker,controller
      KAFKA_LISTENERS:                       PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:            PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS:        1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES:       CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME:      PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:       'true'
      CLUSTER_ID:                            MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Dev tooling ──────────────────────────────────────────────────────────

  mongo-express:
    image: mongo-express:1.0
    container_name: rms-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: rms
      ME_CONFIG_MONGODB_ADMINPASSWORD: rms_secret
      ME_CONFIG_MONGODB_URL: mongodb://rms:rms_secret@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb: { condition: service_healthy }
    profiles: ["dev-tools"]

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rms-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis: { condition: service_healthy }
    profiles: ["dev-tools"]

# ─── Microservices ────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: rms-auth-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      NODE_ENV:          development
      PORT:              3004
      MONGODB_URI:       mongodb://rms:rms_secret@mongodb:27017
      MONGODB_DB_NAME:   rms_auth
      JWT_SECRET:        dev-secret-change-in-prod
      LOG_LEVEL:         info
    depends_on:
      mongodb: { condition: service_healthy }

  menu-service:
    build:
      context: .
      dockerfile: apps/menu-service/Dockerfile
    container_name: rms-menu-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV:          development
      PORT:              3001
      MONGODB_URI:       mongodb://rms:rms_secret@mongodb:27017
      MONGODB_DB_NAME:   rms_menu
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      JWT_SECRET:        dev-secret-change-in-prod
      KAFKA_BROKERS:     kafka:9092
      LOG_LEVEL:         info
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
      kafka:   { condition: service_healthy }

  inventory-service:
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
    container_name: rms-inventory-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV:          development
      PORT:              3002
      MONGODB_URI:       mongodb://rms:rms_secret@mongodb:27017
      MONGODB_DB_NAME:   rms_inventory
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      JWT_SECRET:        dev-secret-change-in-prod
      KAFKA_BROKERS:     kafka:9092
      LOG_LEVEL:         info
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
      kafka:   { condition: service_healthy }

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: rms-order-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV:          development
      PORT:              3003
      MONGODB_URI:       mongodb://rms:rms_secret@mongodb:27017
      MONGODB_DB_NAME:   rms_orders
      REDIS_HOST:        redis
      REDIS_PORT:        6379
      JWT_SECRET:        dev-secret-change-in-prod
      KAFKA_BROKERS:     kafka:9092
      LOG_LEVEL:         info
    depends_on:
      mongodb: { condition: service_healthy }
      redis:   { condition: service_healthy }
      kafka:   { condition: service_healthy }
      menu-service:      { condition: service_started }
      inventory-service: { condition: service_started }

  reporting-service:
    build:
      context: .
      dockerfile: apps/reporting-service/Dockerfile
    container_name: rms-reporting-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      NODE_ENV:      development
      PORT:          3006
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      LOG_LEVEL:     info
    depends_on:
      redis: { condition: service_healthy }

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: rms-notification-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      NODE_ENV:      development
      PORT:          3005
      REDIS_HOST:    redis
      REDIS_PORT:    6379
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL:     info
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: rms-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:              development
      PORT:                  3000
      AUTH_SERVICE_URL:      http://auth-service:3004
      MENU_SERVICE_URL:      http://menu-service:3001
      INVENTORY_SERVICE_URL: http://inventory-service:3002
      ORDER_SERVICE_URL:     http://order-service:3003
    depends_on:
      - auth-service
      - menu-service
      - inventory-service
      - order-service

volumes:
  mongo_data:
  redis_data: